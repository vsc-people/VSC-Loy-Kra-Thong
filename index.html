<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VSC ลอยกระทงออนไลน์</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt for Thai typography -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            overflow: hidden;
            background-color: #020617; /* Slate 950 fallback */
            touch-action: none; /* Prevent scroll on touch devices */
        }

        /* Environments */
        .sky-gradient {
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #172554 100%);
        }
        
        .river-gradient {
            background: linear-gradient(180deg, #082f49 0%, #020617 100%);
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Moon and Reflections */
        .moon {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fffedf 0%, #fdf49a 50%, #f7e05e 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px 15px rgba(253, 244, 154, 0.4), 
                        inset -10px -10px 20px rgba(0,0,0,0.1);
        }
        
        .moon-reflection {
            width: 150px;
            height: 200px;
            background: linear-gradient(180deg, rgba(253, 244, 154, 0.3) 0%, rgba(253, 244, 154, 0) 100%);
            border-radius: 50%;
            filter: blur(15px);
            transform: scaleY(0.3);
            transform-origin: top;
        }

        /* Stars Animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate ease-in-out;
        }

        /* Krathong & Lantern Animations */
        @keyframes bob {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        
        @keyframes sway {
            0%, 100% { transform: translateX(0px) rotate(-4deg); }
            50% { transform: translateX(25px) rotate(4deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        .lantern-wrapper {
            position: absolute;
            will-change: bottom, left, transform;
        }

        .lantern-body {
            animation: sway 5s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .krathong-wrapper {
            position: absolute;
            will-change: left, transform; 
        }

        .krathong-bob {
            animation: bob 3.5s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candle-flame {
            width: 8px;
            height: 12px;
            background: #fcd34d;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px 5px rgba(251, 146, 60, 0.6);
            animation: pulse-glow 1.5s infinite alternate ease-in-out;
        }

        /* UI Elements */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col relative">

    <!-- Sky Section -->
    <div id="sky" class="sky-gradient h-[55%] relative w-full z-0 overflow-hidden">
        <!-- Stars injected via JS -->
        
        <div class="absolute top-10 right-10 md:top-16 md:right-24">
            <div class="moon"></div>
        </div>

        <div class="absolute top-0 left-0 w-full pt-8 pb-4 text-center z-20 pointer-events-none">
            <h1 class="text-4xl md:text-5xl font-bold tracking-wider drop-shadow-[0_0_15px_rgba(255,255,255,0.8)] text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 to-yellow-400">
                VSC ลอยกระทงออนไลน์
            </h1>
            <p class="text-indigo-200 mt-2 text-sm md:text-base font-light tracking-wide">ร่วมสืบสานประเพณีไทยและขอพรไปด้วยกัน</p>
        </div>
    </div>

    <!-- River Section -->
    <div id="river" class="river-gradient h-[45%] relative w-full z-10 overflow-hidden">
        <div class="absolute top-0 right-10 md:right-24 moon-reflection"></div>
        <div id="krathong-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="absolute bottom-6 left-0 w-full flex justify-center gap-4 z-30 px-4">
        <button id="btn-open-krathong" class="glass-panel px-6 py-3 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:bg-white/10 hover:scale-105 transition-all duration-300 flex items-center gap-2 border-white/20">
            <span class="text-xl">🪷</span>
            <span class="font-semibold text-sm md:text-base tracking-wide text-blue-50">ลอยกระทง</span>
        </button>
        <button id="btn-open-lantern" class="glass-panel px-6 py-3 rounded-full shadow-[0_0_20px_rgba(251,146,60,0.3)] hover:bg-white/10 hover:scale-105 transition-all duration-300 flex items-center gap-2 border-white/20">
            <span class="text-xl">🏮</span>
            <span class="font-semibold text-sm md:text-base tracking-wide text-orange-50">ปล่อยโคมลอย</span>
        </button>
    </div>

    <!-- Unified Form Modal -->
    <div id="krathong-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 hidden">
        <div class="glass-panel w-[90%] max-w-md max-h-[90vh] overflow-y-auto rounded-2xl p-6 md:p-8 transform scale-95 transition-transform duration-300" id="modal-content">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-yellow-300" id="modal-title">สร้างกระทงของคุณ</h2>
                <button id="btn-close-modal" class="text-gray-400 hover:text-white transition-colors text-2xl">&times;</button>
            </div>

            <form id="krathong-form" class="space-y-5">
                <div>
                    <label class="block text-sm text-blue-200 mb-1">ชื่อ - นามสกุล (หรือชื่อเล่น)</label>
                    <input type="text" id="k-name" required maxlength="30" placeholder="ระบุชื่อของคุณ" 
                        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-all">
                </div>
                
                <div>
                    <label class="block text-sm text-blue-200 mb-1">คำอธิษฐานขอพร</label>
                    <textarea id="k-wish" required maxlength="120" rows="3" placeholder="เขียนคำอธิษฐานสิ่งดีๆ..." 
                        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-all resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm text-blue-200 mb-1">ใส่รูปภาพ (ถ้ามี)</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="k-image" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-500/20 file:text-blue-200 hover:file:bg-blue-500/30 transition-all cursor-pointer">
                        <img id="k-image-preview" src="" class="hidden w-12 h-12 rounded-full object-cover border-2 border-white/20 shadow-md">
                    </div>
                </div>

                <!-- Krathong Section -->
                <div id="krathong-options" class="space-y-4 transition-all duration-300">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกฐานกระทง (Base)</label>
                        <div class="grid grid-cols-3 gap-2 md:gap-3">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="banana" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🌿</div><div class="text-[10px] md:text-xs">ใบตอง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="lotus" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🪷</div><div class="text-[10px] md:text-xs">ดอกบัว</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="coconut" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🥥</div><div class="text-[10px] md:text-xs">กะลา</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="bread" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🍞</div><div class="text-[10px] md:text-xs">ขนมปัง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="ice" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🧊</div><div class="text-[10px] md:text-xs">น้ำแข็ง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-base" value="paper" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">

                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกดอกไม้ประดับ (Decorations)</label>
                        <div class="grid grid-cols-3 gap-2 md:gap-3">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-flower" value="marigold" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🌼</div><div class="text-[10px] md:text-xs">ดาวเรือง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-flower" value="orchid" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🌺</div><div class="text-[10px] md:text-xs">กล้วยไม้</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-flower" value="jasmine" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🤍</div><div class="text-[10px] md:text-xs">มะลิ</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-flower" value="amaranth" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🌸</div><div class="text-[10px] md:text-xs">บานไม่รู้โรย</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-blue-200 mb-2">ของประดับ (Extras)</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-extra" value="candle" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🕯️</div><div class="text-[10px] md:text-xs">ธูปเทียน</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-extra" value="sparkler" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">✨</div><div class="text-[10px] md:text-xs">ไฟเย็น</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-extra" value="coins" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🪙</div><div class="text-[10px] md:text-xs">เหรียญทอง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="k-extra" value="duck" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="text-2xl mb-1">🦆</div><div class="text-[10px] md:text-xs">เป็ดน้อย</div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Lantern Section -->
                <div id="lantern-options" class="space-y-4 hidden transition-all duration-300">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกสีโคมลอย (Color)</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="l-color" value="orange" checked class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="w-6 h-8 bg-gradient-to-b from-orange-400 to-orange-600 rounded-t-full rounded-b-sm mx-auto mb-2 shadow-[0_0_10px_rgba(251,146,60,0.5)]"></div>
                                    <div class="text-[10px] md:text-xs font-medium">สีส้ม</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="l-color" value="yellow" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="w-6 h-8 bg-gradient-to-b from-yellow-300 to-yellow-500 rounded-t-full rounded-b-sm mx-auto mb-2 shadow-[0_0_10px_rgba(250,204,21,0.5)]"></div>
                                    <div class="text-[10px] md:text-xs font-medium">สีเหลือง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="l-color" value="red" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-red-400 peer-checked:bg-red-400/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="w-6 h-8 bg-gradient-to-b from-red-400 to-red-600 rounded-t-full rounded-b-sm mx-auto mb-2 shadow-[0_0_10px_rgba(248,113,113,0.5)]"></div>
                                    <div class="text-[10px] md:text-xs font-medium">สีแดง</div>
                                </div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="l-color" value="white" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-gray-200 peer-checked:bg-gray-200/20 transition-all hover:bg-white/5 shadow-sm">
                                    <div class="w-6 h-8 bg-gradient-to-b from-gray-100 to-gray-300 rounded-t-full rounded-b-sm mx-auto mb-2 shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
                                    <div class="text-[10px] md:text-xs font-medium">สีขาว</div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transform transition-all active:scale-95 mt-6">
                    ปล่อย 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-opacity duration-300 opacity-0 pointer-events-none">
        <span id="toast-msg" class="font-medium text-white"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vsc-loi-krathong';
        let firebaseConfig = null;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { 
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config; 
            } catch (e) { 
                console.error("Error parsing firebase config", e); 
            }
        }

        let app, db, auth, currentUser = null;
        let isOnline = false;

        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isOnline = true;
            } catch (e) { console.error("Firebase init error", e); }
        }
        
        const activeItemsMap = new Map();
        let currentBase64Image = null; 
        let currentActionType = 'krathong';

        function generateStars() {
            const sky = document.getElementById('sky');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                sky.appendChild(star);
            }
        }

        async function initApp() {
            generateStars();
            setupUIHandlers();
            
            requestAnimationFrame(animationLoop);

            if (!isOnline || !auth || !db) {
                showToast("โหมดสาธิตออฟไลน์", true);
                return;
            }

            try {
                showToast("กำลังเชื่อมต่อเซิร์ฟเวอร์ห้อง VSC...", false);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                listenToCompanyRoom();
            } catch (error) {
                console.error("Auth failed:", error);
                showToast("การเชื่อมต่อล้มเหลว", true);
            }
        }

        function setupUIHandlers() {
            const modal = document.getElementById('krathong-modal');
            const modalContent = document.getElementById('modal-content');
            
            const openModal = (type) => {
                currentActionType = type;
                const title = document.getElementById('modal-title');
                const btnSubmit = document.getElementById('btn-submit');
                const krathongOpts = document.getElementById('krathong-options');
                const lanternOpts = document.getElementById('lantern-options');

                if (type === 'krathong') {
                    title.innerText = 'สร้างกระทงของคุณ';
                    title.className = 'text-2xl font-semibold text-yellow-300';
                    btnSubmit.innerHTML = 'ปล่อยกระทง 🪷';
                    btnSubmit.className = 'w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg mt-6';
                    krathongOpts.classList.remove('hidden');
                    lanternOpts.classList.add('hidden');
                } else {
                    title.innerText = 'สร้างโคมลอยของคุณ';
                    title.className = 'text-2xl font-semibold text-orange-400';
                    btnSubmit.innerHTML = 'ปล่อยโคมลอย 🏮';
                    btnSubmit.className = 'w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 hover:to-red-500 text-white font-semibold py-3 rounded-xl shadow-lg mt-6';
                    krathongOpts.classList.add('hidden');
                    lanternOpts.classList.remove('hidden');
                }

                modal.classList.remove('hidden');
                modal.classList.remove('pointer-events-none');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
            };

            document.getElementById('btn-open-krathong').addEventListener('click', () => openModal('krathong'));
            document.getElementById('btn-open-lantern').addEventListener('click', () => openModal('lantern'));

            const closeModal = () => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                modal.classList.add('pointer-events-none');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            // Compress image logic
            document.getElementById('k-image').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) {
                    currentBase64Image = null;
                    document.getElementById('k-image-preview').classList.add('hidden');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 64;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                        else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        currentBase64Image = canvas.toDataURL('image/webp', 0.8);
                        
                        const preview = document.getElementById('k-image-preview');
                        preview.src = currentBase64Image;
                        preview.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('krathong-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await submitItem();
                closeModal();
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-opacity duration-300 text-white ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            setTimeout(() => { toast.classList.remove('opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
        }

        async function submitItem() {
            const name = document.getElementById('k-name').value.trim();
            const wish = document.getElementById('k-wish').value.trim();
            
            const payload = {
                type: currentActionType,
                userId: currentUser ? currentUser.uid : 'local-user',
                name: name,
                wish: wish,
                image: currentBase64Image,
                // Assign a depth tracking layer
                depthPercent: Math.floor(Math.random() * 80) + 10,
                // Duration for the loop
                duration: Math.floor(Math.random() * 30) + (currentActionType === 'krathong' ? 45 : 30),
                createdAt: Date.now()
            };

            if (currentActionType === 'krathong') {
                payload.base = document.querySelector('input[name="k-base"]:checked').value;
                payload.flower = document.querySelector('input[name="k-flower"]:checked').value;
                payload.extra = document.querySelector('input[name="k-extra"]:checked').value;
            } else {
                payload.lanternColor = document.querySelector('input[name="l-color"]:checked').value;
            }

            if (!isOnline || !db || !currentUser) {
                renderItemToDOM(Date.now().toString(), payload);
                document.getElementById('krathong-form').reset();
                currentBase64Image = null; 
                document.getElementById('k-image-preview').classList.add('hidden');
                showToast(`ปล่อยสำเร็จ (ออฟไลน์)`);
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerHTML = 'กำลังปล่อย...';

            try {
                // REQUIRED FIREBASE SECURE PATH MAPPING FOR THE COMPANY ROOM
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'vsc_company_krathong_room');
                await addDoc(colRef, payload);
                document.getElementById('krathong-form').reset();
                currentBase64Image = null;
                document.getElementById('k-image-preview').classList.add('hidden');
                showToast(`ปล่อยสำเร็จ! 🎉`);
            } catch (err) {
                console.error(err);
                showToast("เกิดข้อผิดพลาด", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = currentActionType === 'krathong' ? 'ปล่อยกระทง 🪷' : 'ปล่อยโคมลอย 🏮';
            }
        }

        function listenToCompanyRoom() {
            if (!db) return;
            // CRITICAL: Connect to the exact same static room collection name
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'vsc_company_krathong_room');
            let isFirstLoad = true;

            onSnapshot(colRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') renderItemToDOM(change.doc.id, change.doc.data());
                    if (change.type === 'removed') removeItem(change.doc.id);
                });

                if (isFirstLoad) {
                    showToast(`เชื่อมต่อห้อง VSC สำเร็จ! พบข้อมูล ${snapshot.size} รายการ`, false);
                    isFirstLoad = false;
                }
            }, (err) => console.error("Listen fail: ", err));
        }

        // --- Render Generation ---
        function getKrathongHTML(d) {
            let flowerEmoji = '🌼';
            if (d.flower === 'orchid') flowerEmoji = '🌺';
            if (d.flower === 'rose') flowerEmoji = '🌹';
            if (d.flower === 'jasmine') flowerEmoji = '🤍';
            if (d.flower === 'amaranth') flowerEmoji = '🌸';
            
            const flowers = `<div class="absolute -top-3 flex justify-center w-full text-lg drop-shadow-md z-10"><span class="-mr-1">${flowerEmoji}</span><span class="mb-2 z-10 scale-110">${flowerEmoji}</span><span class="-ml-1">${flowerEmoji}</span></div>`;

            let extraHtml = '';
            if (!d.extra || d.extra === 'candle') {
                extraHtml = `<div class="absolute -top-8 flex gap-0.5 items-end justify-center w-full z-20"><div class="w-1 h-6 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 left-0 w-full h-1 bg-red-500 rounded-full shadow-[0_0_3px_red]"></div></div><div class="w-1 h-7 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 left-0 w-full h-1 bg-red-500 rounded-full shadow-[0_0_3px_red]"></div></div><div class="w-1 h-6 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 left-0 w-full h-1 bg-red-500 rounded-full shadow-[0_0_3px_red]"></div></div><div class="w-1.5 h-5 bg-yellow-200 ml-1 rounded-sm relative shadow-sm"><div class="absolute -top-3 -left-[3px] candle-flame"></div></div></div>`;
            } else if (d.extra === 'sparkler') {
                extraHtml = `<div class="absolute -top-8 flex justify-center w-full z-20"><div class="text-2xl animate-pulse drop-shadow-[0_0_15px_#fde047] filter brightness-125">✨</div><div class="w-1 h-6 bg-gray-400 rounded-full absolute top-5"></div></div>`;
            } else if (d.extra === 'coins') {
                extraHtml = `<div class="absolute -top-5 flex justify-center gap-1 w-full z-20 text-lg drop-shadow-[0_2px_5px_rgba(0,0,0,0.5)]"><div class="transform rotate-12">🪙</div><div class="transform -rotate-12 mt-1">🪙</div><div class="transform rotate-45">🪙</div></div>`;
            } else if (d.extra === 'duck') {
                extraHtml = `<div class="absolute -top-7 flex justify-center w-full z-20 text-[28px] drop-shadow-md">🦆</div>`;
            }

            let baseHtml = '';
            if (d.base === 'banana') baseHtml = `<div class="relative w-16 h-6 bg-green-700 rounded-[50%] shadow-[inset_0_-4px_rgba(0,0,0,0.4),0_2px_4px_rgba(0,0,0,0.5)] border border-green-600 flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-4 bg-green-500 rounded-[50%] border border-green-600/50"></div></div>`;
            else if (d.base === 'lotus') baseHtml = `<div class="relative w-16 h-8 flex items-end justify-center z-10"><div class="text-[3rem] leading-none drop-shadow-lg -mb-2">🪷</div></div>`;
            else if (d.base === 'coconut') baseHtml = `<div class="relative w-14 h-7 bg-[#4a2e15] rounded-b-[30px] rounded-t-[50%] shadow-[inset_0_-5px_rgba(0,0,0,0.6),0_2px_4px_rgba(0,0,0,0.5)] border-t-[3px] border-[#7a4823] z-10"></div>`;
            else if (d.base === 'bread') baseHtml = `<div class="relative w-16 h-7 bg-[#d4a373] rounded-[40%] shadow-[inset_0_-4px_rgba(0,0,0,0.2),0_2px_4px_rgba(0,0,0,0.5)] border border-[#bc6c25] flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-4 bg-[#faedcd] rounded-[40%]"></div></div>`;
            else if (d.base === 'ice') baseHtml = `<div class="relative w-16 h-7 bg-cyan-200/50 backdrop-blur-md rounded-[10%] shadow-[inset_0_0_10px_rgba(255,255,255,0.8),0_2px_10px_rgba(34,211,238,0.6)] border border-white/80 z-10"></div>`;
            else if (d.base === 'paper') baseHtml = `<div class="relative w-16 h-7 bg-[#e0e0e0] rounded-b-[20px] rounded-t-[50%] shadow-[inset_0_-5px_rgba(0,0,0,0.2),0_2px_4px_rgba(0,0,0,0.5)] border border-[#9e9e9e] flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-3 bg-[#f5f5f5] rounded-[50%] border border-[#bdbdbd]"></div></div>`;
            
            const userImg = d.image ? `<div class="absolute -top-11 -right-2 z-30 w-8 h-8 rounded-full border-[1.5px] border-white/80 shadow-[0_0_8px_rgba(255,255,255,0.4)] overflow-hidden bg-white/20 transform rotate-[10deg]"><img src="${d.image}" class="w-full h-full object-cover"></div>` : '';
            
            return `<div class="relative flex flex-col items-center mt-6">${userImg}${extraHtml}${d.base === 'lotus' ? `<div class="absolute -top-1 z-10"><span>${flowerEmoji}</span></div>` : flowers}${baseHtml}<div class="absolute -bottom-2 w-16 h-4 bg-blue-400/20 rounded-[50%] blur-sm z-0"></div></div>`;
        }

        function getLanternHTML(d) {
            let colorCls = 'bg-gradient-to-b from-orange-400 to-orange-600', shadow = 'rgba(251,146,60,0.8)';
            if (d.lanternColor === 'yellow') { colorCls = 'bg-gradient-to-b from-yellow-300 to-yellow-500'; shadow = 'rgba(250,204,21,0.8)'; }
            else if (d.lanternColor === 'red') { colorCls = 'bg-gradient-to-b from-red-400 to-red-600'; shadow = 'rgba(248,113,113,0.8)'; }
            else if (d.lanternColor === 'white') { colorCls = 'bg-gradient-to-b from-gray-100 to-gray-300'; shadow = 'rgba(255,255,255,0.8)'; }

            const userImg = d.image ? `<div class="absolute -right-4 top-1/4 z-30 w-8 h-8 rounded-full border-[1.5px] border-white/80 shadow-[0_0_8px_rgba(255,255,255,0.4)] overflow-hidden bg-white/20 transform rotate-[10deg]"><img src="${d.image}" class="w-full h-full object-cover"></div>` : '';
            return `<div class="relative flex flex-col items-center mt-8">${userImg}<div class="relative w-14 h-20 ${colorCls} rounded-t-[50%] rounded-b-[20%] shadow-[inset_0_-10px_20px_rgba(0,0,0,0.5),0_0_30px_${shadow}] flex justify-center items-end pb-1.5 z-10"><div class="w-10 h-1.5 bg-amber-900 rounded-sm z-20"></div><div class="absolute bottom-2 w-6 h-6 bg-yellow-100 rounded-full blur-md opacity-80 animate-pulse z-10"></div><div class="absolute bottom-3 w-3 h-3 bg-white rounded-full blur-sm z-10"></div></div></div>`;
        }

        function renderItemToDOM(id, data) {
            if (activeItemsMap.has(id)) return;

            const isLantern = data.type === 'lantern';
            const container = document.getElementById(isLantern ? 'sky' : 'krathong-container');
            const wrapper = document.createElement('div');
            wrapper.id = `item-${id}`;

            const scale = 0.5 + (data.depthPercent / 100) * 0.7; 

            if (isLantern) {
                wrapper.className = 'lantern-wrapper';
                wrapper.style.zIndex = Math.floor(data.depthPercent);
                wrapper.style.transform = `scale(${scale})`;
                
                // Add left wobble based on depth for lanterns
                wrapper.style.left = `${data.depthPercent}%`; 

                wrapper.innerHTML = `
                    <div class="lantern-body relative">
                        <div class="absolute bottom-full mb-2 flex flex-col items-center pointer-events-none w-max max-w-[160px] z-30 hover:scale-110">
                            <div class="glass-panel px-3 py-2 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.1)] border border-white/20 text-center">
                                <p class="font-bold text-orange-200 text-sm truncate max-w-full tracking-wide">${escapeHtml(data.name)}</p>
                                ${data.wish ? `<p class="text-[11px] text-white/90 line-clamp-2 mt-0.5">${escapeHtml(data.wish)}</p>` : ''}
                            </div>
                            <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-white/30 -mt-[1px]"></div>
                        </div>
                        ${getLanternHTML(data)}
                    </div>
                `;
            } else {
                wrapper.className = 'krathong-wrapper';
                wrapper.style.top = `${data.depthPercent}%`;
                wrapper.style.zIndex = Math.floor(data.depthPercent);
                wrapper.style.transform = `scale(${scale})`;

                wrapper.innerHTML = `
                    <div class="krathong-bob relative">
                        <div class="absolute bottom-full mb-3 flex flex-col items-center pointer-events-none w-max max-w-[160px] z-30 hover:scale-110">
                            <div class="glass-panel px-3 py-2 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.1)] border border-white/20 text-center">
                                <p class="font-bold text-yellow-300 text-sm truncate max-w-full tracking-wide">${escapeHtml(data.name)}</p>
                                ${data.wish ? `<p class="text-[11px] text-white/90 line-clamp-2 mt-0.5">${escapeHtml(data.wish)}</p>` : ''}
                            </div>
                            <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-white/30 -mt-[1px]"></div>
                        </div>
                        ${getKrathongHTML(data)}
                    </div>
                `;
            }

            container.appendChild(wrapper);
            activeItemsMap.set(id, { element: wrapper, data: data });
        }

        function removeItem(id) {
            const el = document.getElementById(`item-${id}`);
            if (el) el.remove();
            activeItemsMap.delete(id);
        }

        // --- Core Animation Engine (100% Synchronized) ---
        function animationLoop() {
            const now = Date.now();
            const wWidth = window.innerWidth;
            const wHeight = window.innerHeight;

            activeItemsMap.forEach((item) => {
                const ageMs = now - (item.data.createdAt || now);
                const durationMs = (item.data.duration || 45) * 1000;
                
                // Calculates strict modular deterministic progress
                let progress = (ageMs / durationMs) % 1;
                if (progress < 0) progress += 1; 

                if (item.data.type === 'lantern') {
                    // Lantern: Bottom to Top diagonal floating
                    const startBottom = -150; 
                    const endBottom = wHeight + 200;
                    const currentBottom = startBottom + (progress * (endBottom - startBottom));
                    item.element.style.bottom = `${currentBottom}px`;
                    
                    // Minor diagonal wind drift based on depth
                    const leftDrift = (item.data.depthPercent) + (progress * 20); 
                    item.element.style.left = `${leftDrift % 100}%`;

                } else {
                    // Krathong: Right to Left Flow (As requested)
                    const startX = wWidth + 200; // Start offscreen right
                    const endX = -250;           // End offscreen left
                    const currentLeft = startX - (progress * (startX - endX));
                    item.element.style.left = `${currentLeft}px`;
                }
            });

            requestAnimationFrame(animationLoop);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
