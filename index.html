<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VSC ลอยกระทงออนไลน์ 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            overflow: hidden;
            background-color: #020617;
            touch-action: none; 
            height: 100dvh; /* Mobile viewport fix */
            width: 100vw;
        }

        /* Environments */
        .sky-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #172554 100%); }
        .river-gradient {
            background: linear-gradient(180deg, #082f49 0%, #020617 100%);
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Moon and Reflections */
        .moon {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fffedf 0%, #fdf49a 50%, #f7e05e 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px 15px rgba(253, 244, 154, 0.4), inset -10px -10px 20px rgba(0,0,0,0.1);
        }
        
        .moon-reflection {
            width: 150px;
            height: 200px;
            background: linear-gradient(180deg, rgba(253, 244, 154, 0.3) 0%, rgba(253, 244, 154, 0) 100%);
            border-radius: 50%;
            filter: blur(15px);
            transform: scaleY(0.3);
            transform-origin: top;
        }

        /* Stars Animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate ease-in-out;
        }

        /* Internal Element Animations (Bobbing & Flickering) */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        /* Base Wrappers (Positions strictly controlled by JS Math) */
        .lantern-wrapper {
            position: absolute;
            will-change: top, left; 
        }
        .krathong-wrapper {
            position: absolute;
            will-change: left, top;
        }

        .krathong-bob { display: flex; flex-direction: column; align-items: center; }
        
        .candle-flame {
            width: 8px;
            height: 12px;
            background: #fcd34d;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px 5px rgba(251, 146, 60, 0.6);
            animation: pulse-glow 1.5s infinite alternate ease-in-out;
        }

        /* UI Elements */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="text-white flex flex-col relative">

    <!-- Room Info & Share Button -->
    <div class="absolute top-4 right-4 md:top-6 md:right-6 z-40 flex flex-col items-end gap-2">
        <div class="glass-panel px-3 py-1.5 rounded-lg text-[10px] md:text-xs text-blue-200 border-white/10 flex items-center gap-2 shadow-lg backdrop-blur-md">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            <span id="display-room-id" class="font-mono tracking-wider text-white">รหัสห้อง: ...</span>
        </div>
        <button id="btn-copy-link" class="glass-panel px-3 py-2 rounded-lg text-xs md:text-sm text-white hover:bg-white/20 hover:scale-105 transition-all flex items-center gap-2 border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.1)] active:scale-95">
            <span class="text-base">🔗</span> <span class="hidden sm:inline font-medium">คัดลอกลิงก์ชวนเพื่อน</span><span class="sm:hidden font-medium">แชร์ลิงก์</span>
        </button>
    </div>

    <!-- Sky Section -->
    <div id="sky" class="sky-gradient h-[55%] relative w-full z-0 overflow-hidden">
        <!-- Moon -->
        <div class="absolute top-10 right-10 md:top-16 md:right-24"><div class="moon"></div></div>

        <div class="absolute top-0 left-0 w-full pt-8 pb-4 text-center z-20 pointer-events-none">
            <h1 class="text-4xl md:text-5xl font-bold tracking-wider drop-shadow-[0_0_15px_rgba(255,255,255,0.8)] text-transparent bg-clip-text bg-gradient-to-b from-yellow-100 to-yellow-400">
                VSC ลอยกระทง 2026
            </h1>
            <p class="text-indigo-200 mt-2 text-sm md:text-base font-light tracking-wide">สืบสานประเพณีและขอพรร่วมกันแบบ Real-time</p>
            
            <!-- Global Sync Status Indicator -->
            <div class="mt-2 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-green-500/20 border border-green-500/50 backdrop-blur-sm shadow-[0_0_10px_rgba(34,197,94,0.3)]">
                <div class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse shadow-[0_0_5px_#4ade80]"></div>
                <span class="text-xs md:text-sm text-green-300 font-medium tracking-wider">Global Center Sync: ON</span>
            </div>
        </div>
    </div>

    <!-- River Section -->
    <div id="river" class="river-gradient h-[45%] relative w-full z-10 overflow-hidden">
        <div class="absolute top-0 right-10 md:right-24 moon-reflection"></div>
        <div id="krathong-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="absolute bottom-6 left-0 w-full flex justify-center gap-4 z-30 px-4">
        <button id="btn-open-krathong" class="glass-panel px-6 py-3 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:bg-white/10 hover:scale-105 transition-all duration-300 flex items-center gap-2 border-white/20">

        <button id="btn-open-lantern" class="glass-panel px-6 py-3 rounded-full shadow-[0_0_20px_rgba(251,146,60,0.4)] hover:bg-white/10 hover:scale-105 transition-all duration-300 flex items-center gap-2 border-white/20">
            <span class="text-xl">🏮</span>

    <!-- Unified Form Modal -->
    <div id="action-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 hidden">
        <div class="glass-panel w-[90%] max-w-md max-h-[90dvh] overflow-y-auto rounded-2xl p-6 transform scale-95 transition-transform duration-300" id="modal-content">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-yellow-300" id="modal-title">สร้างกระทงของคุณ</h2>
                <button id="btn-close-modal" class="text-gray-400 hover:text-white transition-colors text-3xl leading-none">&times;</button>

            <form id="action-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-blue-200 mb-1">ชื่อ - นามสกุล (หรือชื่อเล่น)</label>
                    <input type="text" id="input-name" required maxlength="30" placeholder="ระบุชื่อของคุณ" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 transition-all">
                </div>
                
                <div>
                    <label class="block text-sm text-blue-200 mb-1">คำอธิษฐานขอพร</label>
                    <textarea id="input-wish" maxlength="120" rows="2" placeholder="เขียนคำอธิษฐานสิ่งดีๆ..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 transition-all resize-none"></textarea>

                <div>
                    <label class="block text-sm text-blue-200 mb-1">ใส่รูปภาพ (ถ้ามี)</label>

                        <input type="file" id="input-image" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-500/20 file:text-blue-200 hover:file:bg-blue-500/30 transition-all cursor-pointer">
                        <img id="image-preview" src="" class="hidden w-12 h-12 rounded-full object-cover border-2 border-white/20 shadow-md shrink-0">
                    </div>
                </div>

                <!-- Krathong Specific Options -->
                <div id="krathong-options" class="space-y-4 transition-all duration-300">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกฐานกระทง</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-base" value="banana" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all"><div class="text-2xl mb-1">🌿</div><div class="text-[10px]">ใบตอง</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-base" value="bread" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all"><div class="text-2xl mb-1">🍞</div><div class="text-[10px]">ขนมปัง</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-base" value="ice" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-blue-400 peer-checked:bg-blue-400/20 transition-all"><div class="text-2xl mb-1">🧊</div><div class="text-[10px]">น้ำแข็ง</div></div>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกดอกไม้ประดับ</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-flower" value="marigold" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all"><div class="text-2xl mb-1">🌼</div><div class="text-[10px]">ดาวเรือง</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-flower" value="lotus" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-pink-400 peer-checked:bg-pink-400/20 transition-all"><div class="text-2xl mb-1">🪷</div><div class="text-[10px]">ดอกบัว</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-flower" value="rose" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-red-400 peer-checked:bg-red-400/20 transition-all"><div class="text-2xl mb-1">🌹</div><div class="text-[10px]">กุหลาบ</div></div>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">ของประดับ (Extras)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-extra" value="candle" checked class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all"><div class="text-xl mb-1">🕯️</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-extra" value="sparkler" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all"><div class="text-xl mb-1">✨</div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-extra" value="incense" class="peer sr-only">
                                <div class="p-2 rounded-xl border border-white/10 peer-checked:border-orange-400 peer-checked:bg-orange-400/20 transition-all"><div class="text-xl mb-1">🥢</div></div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Lantern Specific Options -->
                <div id="lantern-options" class="space-y-4 hidden transition-all duration-300">
                    <div>
                        <label class="block text-sm text-blue-200 mb-2">เลือกสีโคมลอย</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-color" value="red" checked class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-red-400 peer-checked:bg-red-400/20 transition-all"><div class="w-6 h-8 bg-gradient-to-b from-red-500 to-red-700 rounded-t-full rounded-b-sm mx-auto shadow-md"></div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-color" value="yellow" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 transition-all"><div class="w-6 h-8 bg-gradient-to-b from-yellow-300 to-yellow-500 rounded-t-full rounded-b-sm mx-auto shadow-md"></div></div>
                            </label>
                            <label class="cursor-pointer relative text-center">
                                <input type="radio" name="opt-color" value="white" class="peer sr-only">
                                <div class="p-3 rounded-xl border border-white/10 peer-checked:border-gray-200 peer-checked:bg-gray-200/20 transition-all"><div class="w-6 h-8 bg-gradient-to-b from-gray-100 to-gray-300 rounded-t-full rounded-b-sm mx-auto shadow-md"></div></div>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transform transition-all active:scale-95 mt-4">
                    ปล่อย 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Status Toast -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-opacity duration-300 opacity-0 pointer-events-none text-sm md:text-base text-center w-max max-w-[90vw]">
        <span id="toast-msg" class="font-medium text-white line-clamp-1"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vsc-loi-krathong';
        const ROOM_COLLECTION = 'vsc_global_center_room'; // STRICT REQUIREMENT: SINGLE CENTRALIZED ROOM
        
        let app, db, auth, currentUser = null;

        // Safely Parse Firebase Config
        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config; } catch(e){}
        }

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) { 
            console.error("Firebase init error", e); 
        }
        
        // App State
        const activeItemsMap = new Map();
        let currentBase64Image = null; 
        let currentActionType = 'krathong'; // 'krathong' or 'lantern'

        // --- Core Startup ---
        window.addEventListener('DOMContentLoaded', async () => {
            generateStars();
            setupUIHandlers();
            
            // Start the pure JS mathematical render loop immediately
            requestAnimationFrame(animationLoop);

            try {
                // Mandatory Authentication Sequence
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                listenToCompanyRoom();
            } catch (error) {
                console.error("Primary Auth failed, attempting fallback:", error);
                try {
                    await signInAnonymously(auth);
                    currentUser = auth.currentUser;
                    listenToCompanyRoom();
                } catch (fallbackError) {
                    console.error("Complete auth failure:", fallbackError);
                }
            }
        });

        // --- UI & Event Handlers ---
        function setupUIHandlers() {
            const modal = document.getElementById('action-modal');
            const modalContent = document.getElementById('modal-content');
            
            const openModal = (type) => {
                currentActionType = type;
                const title = document.getElementById('modal-title');
                const btnSubmit = document.getElementById('btn-submit');
                const krathongOpts = document.getElementById('krathong-options');
                const lanternOpts = document.getElementById('lantern-options');

                if (type === 'krathong') {
                    title.innerText = 'สร้างกระทงของคุณ';
                    title.className = 'text-2xl font-semibold text-yellow-300';
                    btnSubmit.innerHTML = 'ปล่อยกระทง 🪷';
                    btnSubmit.className = 'w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg mt-4';
                    krathongOpts.classList.remove('hidden');
                    lanternOpts.classList.add('hidden');
                } else {
                    title.innerText = 'สร้างโคมลอยของคุณ';
                    title.className = 'text-2xl font-semibold text-orange-400';
                    btnSubmit.innerHTML = 'ปล่อยโคมลอย 🏮';
                    btnSubmit.className = 'w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 text-white font-semibold py-3 rounded-xl shadow-lg mt-4';
                    krathongOpts.classList.add('hidden');
                    lanternOpts.classList.remove('hidden');
                }

                modal.classList.remove('hidden');
                modal.classList.remove('pointer-events-none');
                setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10);
            };

            const closeModal = () => {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                modal.classList.add('pointer-events-none');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            document.getElementById('btn-open-krathong').addEventListener('click', () => openModal('krathong'));
            document.getElementById('btn-open-lantern').addEventListener('click', () => openModal('lantern'));
            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            // Set UI Room ID
            document.getElementById('display-room-id').innerText = `Room ID: ${appId}`;

            // Copy Link Functionality (iFrame Safe)
            document.getElementById('btn-copy-link').addEventListener('click', () => {
                const url = window.location.href;
                const textArea = document.createElement("textarea");
                textArea.value = url;
                textArea.style.position = "fixed"; // Avoid scrolling to bottom
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('🔗 คัดลอกลิงก์สำเร็จ! ส่งให้เพื่อนได้เลย', false);
                } catch (err) {
                    console.error('Fallback copy failed', err);
                    showToast('คัดลอกลิงก์ไม่สำเร็จ กรุณากดแชร์จากเบราว์เซอร์', true);
                }
                document.body.removeChild(textArea);
            });

            // Image Compression to Max 64x64
            document.getElementById('input-image').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) {
                    currentBase64Image = null;
                    document.getElementById('image-preview').classList.add('hidden');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 64;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                        else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        currentBase64Image = canvas.toDataURL('image/webp', 0.8);
                        
                        const preview = document.getElementById('image-preview');
                        preview.src = currentBase64Image;
                        preview.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // CRITICAL FIX 3: PREVENT DEFAULT AND HANDLE SUBMISSION
            document.getElementById('action-form').addEventListener('submit', async (e) => {
                e.preventDefault(); 
                
                const btn = document.getElementById('btn-submit');
                btn.disabled = true; 
                btn.innerHTML = 'กำลังปล่อย...';
                
                await submitItem();
                
                btn.disabled = false;
            });
        }

        // --- Data Submission (Optimistic UI Enabled) ---
        async function submitItem() {
            // Generate a unique local ID to track this specific submission and prevent double rendering
            const localId = 'local-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
            
            // CRITICAL FIX 2: BACKDATED SPAWN
            // We subtract 3000ms from current time so the math evaluates the position 
            // well inside the screen boundaries instead of strictly at 0% (off-screen).
            const spawnOffsetMs = 3000; 

            const payload = {
                localId: localId, // Used for deduplication in onSnapshot
                type: currentActionType || 'krathong',
                userId: currentUser ? currentUser.uid : 'local',
                name: document.getElementById('input-name').value.trim() || 'พนักงาน VSC',
                wish: document.getElementById('input-wish').value.trim() || '',
                image: currentBase64Image || '',
                depthPercent: Math.floor(Math.random() * 80) + 10,
                createdAt: Date.now() - spawnOffsetMs 
            };

            // Grab mode-specific properties
            if (currentActionType === 'krathong') {
                payload.base = document.querySelector('input[name="opt-base"]:checked')?.value || 'banana';
                payload.flower = document.querySelector('input[name="opt-flower"]:checked')?.value || 'marigold';
                payload.extra = document.querySelector('input[name="opt-extra"]:checked')?.value || 'candle';
            } else {
                payload.lanternColor = document.querySelector('input[name="opt-color"]:checked')?.value || 'red';
            }

            // CRITICAL FIX 1: OPTIMISTIC UI RENDER
            // Render it locally *immediately* before sending to Firebase.
            renderItemToDOM(localId, payload);
            
            // Reset and close UI instantly for great UX
            document.getElementById('action-form').reset();
            currentBase64Image = null;
            document.getElementById('image-preview').classList.add('hidden');
            
            // Trigger Close Modal manually to hide instantly
            const modal = document.getElementById('action-modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            modal.classList.add('pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 300);

            // Send to Firebase in background
            if (!db || !currentUser) {
                console.warn("ไม่สามารถส่งข้อมูลได้: ยังไม่เชื่อมต่อเซิร์ฟเวอร์");
                return;
            }

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', ROOM_COLLECTION);
                await addDoc(colRef, payload);
                showToast(`ปล่อยสำเร็จ! 🎉`, false);
            } catch (err) {
                console.error("Submit error:", err);
            }
        }

        // --- Data Synchronization (Realtime) ---
        function listenToCompanyRoom() {
            if (!db || !currentUser) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', ROOM_COLLECTION);

            onSnapshot(colRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    const data = change.doc.data();
                    // Deduplicate: If it has a localId, use that as the key, otherwise use the firestore document ID
                    const renderId = data.localId || change.doc.id; 

                    if (change.type === 'added' || change.type === 'modified') {
                        // If it's already in our map (because we optimistically rendered it), it will safely ignore it.
                        renderItemToDOM(renderId, data);
                    }
                    if (change.type === 'removed') {
                        removeItem(renderId);
                    }
                });
            }, (err) => {
                console.error("Listen fail: ", err);
                showToast("การเชื่อมต่อ Global มีปัญหา กรุณารีเฟรช", true);
            });
        }

        // --- DOM Rendering Engine ---
        function renderItemToDOM(id, data) {
            // Guard clause to prevent duplicate rendering of the same item
            if (activeItemsMap.has(id)) return;

            const isLantern = data.type === 'lantern';
            const container = document.getElementById(isLantern ? 'sky' : 'krathong-container');
            if (!container) return;

            const wrapper = document.createElement('div');
            wrapper.id = `item-${id}`;
            wrapper.className = isLantern ? 'lantern-wrapper' : 'krathong-wrapper';
            
            // Visual scale and depth mapping
            const depth = data.depthPercent || 50;
            const scale = 0.5 + (depth / 100) * 0.7; 
            wrapper.style.zIndex = Math.floor(depth) + 100; // Super high z-index
            wrapper.style.transform = `scale(${scale})`;

            // Tooltip UI
            const tooltipHTML = `
                <div class="absolute bottom-full mb-3 flex flex-col items-center pointer-events-none w-max max-w-[160px] z-30 hover:scale-110 transition-transform">
                    <div class="glass-panel px-3 py-2 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.1)] border border-white/20 text-center">
                        <p class="font-bold ${isLantern ? 'text-orange-200' : 'text-yellow-300'} text-xs md:text-sm truncate max-w-full tracking-wide">${escapeHtml(data.name)}</p>
                        ${data.wish ? `<p class="text-[10px] md:text-xs text-white/90 line-clamp-2 mt-0.5">${escapeHtml(data.wish)}</p>` : ''}
                    </div>
                    <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-white/30 -mt-[1px]"></div>
                </div>
            `;

            if (isLantern) {
                wrapper.innerHTML = `<div class="relative flex flex-col items-center">${tooltipHTML}${getLanternHTML(data)}</div>`;
            } else {
                wrapper.innerHTML = `<div class="krathong-bob relative">${tooltipHTML}${getKrathongHTML(data)}</div>`;
            }

            container.appendChild(wrapper);
            activeItemsMap.set(id, { element: wrapper, data: data });
        }

        function removeItem(id) {
            const el = document.getElementById(`item-${id}`);
            if (el) el.remove();
            activeItemsMap.delete(id);
        }

        // --- CRITICAL FIX 4: STRICT MATHEMATICAL ANIMATION LOOP WITH ERROR BOUNDARY ---
        function animationLoop() {
            const now = Date.now();

            activeItemsMap.forEach((item, id) => {
                try {
                    const isLantern = item.data.type === 'lantern';
                    const duration = isLantern ? 25000 : 20000;
                    
                    const createdAt = item.data.createdAt || now; 
                    let ageMs = now - createdAt;
                    if (ageMs < 0) ageMs = 0; // Prevent negative math issues
                    
                    // Endless Math Loop
                    let progress = (ageMs % duration) / duration;

                    if (isLantern) {
                        // Lantern: Bottom to Top (Y-axis from 100% to -20%)
                        const currentTop = 100 - (progress * 120);
                        item.element.style.top = `${currentTop}%`;
                        
                        // Sway X-axis softly
                        const baseLeft = item.data.depthPercent || 50; 
                        const sway = Math.sin(ageMs / 1000) * 4; 
                        item.element.style.left = `calc(${baseLeft}% + ${sway}px)`;

                    } else {
                        // Krathong: Right to Left (X-axis from 100% to -20%)
                        const currentLeft = 100 - (progress * 120);
                        item.element.style.left = `${currentLeft}%`;

                        // Bob Y-axis softly on water
                        const baseTop = item.data.depthPercent || 50;
                        const bob = Math.sin(ageMs / 600) * 3;
                        item.element.style.top = `calc(${baseTop}% + ${bob}px)`;
                    }
                } catch(e) {
                    console.error("Animation rendering error for item", id, e);
                }
            });

            requestAnimationFrame(animationLoop);
        }

        // --- HTML Visual Generators ---
        function getKrathongHTML(d) {
            let fEmoji = '🌼';
            if (d.flower === 'lotus') fEmoji = '🪷';
            if (d.flower === 'rose') fEmoji = '🌹';
            
            const flowers = `<div class="absolute -top-3 flex justify-center w-full text-lg drop-shadow-md z-10"><span class="-mr-1">${fEmoji}</span><span class="mb-2 z-10 scale-110">${fEmoji}</span><span class="-ml-1">${fEmoji}</span></div>`;

            let exHtml = '';
            if (d.extra === 'candle' || !d.extra) {
                exHtml = `<div class="absolute -top-8 flex gap-0.5 items-end justify-center w-full z-20"><div class="w-1.5 h-6 bg-amber-900 rounded-sm shadow-sm relative"></div><div class="w-2 h-5 bg-yellow-200 ml-1 rounded-sm relative"><div class="absolute -top-3 -left-[2px] candle-flame"></div></div></div>`;
            } else if (d.extra === 'sparkler') {
                exHtml = `<div class="absolute -top-8 flex justify-center w-full z-20"><div class="text-2xl animate-pulse drop-shadow-[0_0_15px_#fde047]">✨</div></div>`;
            } else if (d.extra === 'incense') {
                exHtml = `<div class="absolute -top-8 flex gap-0.5 items-end justify-center w-full z-20">
                    <div class="w-1 h-8 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 -left-[1px] w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse shadow-[0_0_5px_red]"></div></div>
                    <div class="w-1 h-7 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 -left-[1px] w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse shadow-[0_0_5px_red]"></div></div>
                    <div class="w-1 h-8 bg-amber-900 rounded-t-sm shadow-sm relative"><div class="absolute -top-1 -left-[1px] w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse shadow-[0_0_5px_red]"></div></div>
                </div>`;
            }

            let bsHtml = `<div class="relative w-16 h-6 bg-green-700 rounded-[50%] shadow-lg border border-green-600 flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-4 bg-green-500 rounded-[50%]"></div></div>`;
            if (d.base === 'ice') bsHtml = `<div class="relative w-16 h-6 bg-blue-200/50 backdrop-blur-md rounded-[50%] shadow-[0_0_15px_rgba(255,255,255,0.5)] border border-white/50 flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-4 bg-white/40 rounded-[50%]"></div></div>`;
            if (d.base === 'bread') bsHtml = `<div class="relative w-16 h-7 bg-[#d4a373] rounded-[40%] shadow-lg border border-[#bc6c25] flex items-center justify-center z-10"><div class="absolute top-0 w-14 h-4 bg-[#faedcd] rounded-[40%]"></div></div>`;
            
            const uImg = d.image ? `<div class="absolute -top-11 -right-2 z-30 w-8 h-8 rounded-full border-2 border-white/80 shadow-lg overflow-hidden bg-white/20 transform rotate-6"><img src="${d.image}" class="w-full h-full object-cover" onerror="this.style.display='none'"></div>` : '';
            
            return `<div class="relative flex flex-col items-center mt-6">${uImg}${exHtml}${flowers}${bsHtml}<div class="absolute -bottom-2 w-16 h-4 bg-blue-400/20 rounded-[50%] blur-sm z-0"></div></div>`;
        }

        function getLanternHTML(d) {
            let colorCls = 'bg-gradient-to-b from-red-500 to-red-700', shadow = 'rgba(239,68,68,0.8)';
            if (d.lanternColor === 'yellow') { colorCls = 'bg-gradient-to-b from-yellow-300 to-yellow-500'; shadow = 'rgba(250,204,21,0.8)'; }
            else if (d.lanternColor === 'white') { colorCls = 'bg-gradient-to-b from-gray-100 to-gray-300'; shadow = 'rgba(255,255,255,0.8)'; }

            const uImg = d.image ? `<div class="absolute -right-4 top-1/4 z-30 w-8 h-8 rounded-full border-2 border-white/80 shadow-lg overflow-hidden bg-white/20 transform rotate-6"><img src="${d.image}" class="w-full h-full object-cover" onerror="this.style.display='none'"></div>` : '';
            
            return `<div class="relative flex flex-col items-center mt-8">${uImg}<div class="relative w-14 h-20 ${colorCls} rounded-t-[50%] rounded-b-[20%] shadow-[inset_0_-10px_20px_rgba(0,0,0,0.5),0_0_30px_${shadow}] flex justify-center items-end pb-1.5 z-10"><div class="w-10 h-1.5 bg-amber-900 rounded-sm z-20"></div><div class="absolute bottom-2 w-6 h-6 bg-yellow-100 rounded-full blur-md opacity-80 animate-pulse z-10"></div></div></div>`;
        }

        // --- Utilities ---
        function generateStars() {
            const sky = document.getElementById('sky');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`; star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`; star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`; star.style.animationDelay = `${Math.random() * 5}s`;
                sky.appendChild(star);
            }
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-opacity duration-300 text-white text-sm md:text-base text-center w-max max-w-[90vw] ${isError ? 'bg-red-600' : 'bg-green-600/90 backdrop-blur-sm'}`;
            setTimeout(() => { toast.classList.remove('opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
        }
    </script>
</body>
